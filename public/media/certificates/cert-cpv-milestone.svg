<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <radialGradient id="glowCrimson" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#D97706" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crimsonVelvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="45%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <filter id="shadowCpv" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F1115" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="160" cy="98" r="86" fill="url(#glowCrimson)"/>

  <g filter="url(#shadowCpv)">
    <!-- Framed Official Recognition Plaque -->
    <rect x="70" y="28" width="180" height="132" rx="10" fill="url(#crimsonVelvet)" stroke="url(#goldRim)" stroke-width="3"/>
    <rect x="78" y="36" width="164" height="116" rx="6" fill="#FFFDF9" stroke="url(#goldRim)" stroke-width="1.2"/>

    <!-- Top Star Crest -->
    <circle cx="160" cy="68" r="20" fill="url(#crimsonVelvet)" stroke="url(#goldRim)" stroke-width="2"/>
    <polygon points="160,54 163.8,62.5 173,63.5 166,69.8 168,79 160,74.2 152,79 154,69.8 147,63.5 156.2,62.5" fill="url(#goldRim)"/>

    <!-- Official Typography Lines -->
    <rect x="112" y="98" width="96" height="7" rx="3.5" fill="#7F1D1D"/>
    <rect x="98" y="112" width="124" height="4" rx="2" fill="#9CA3AF"/>
    <rect x="118" y="122" width="84" height="4" rx="2" fill="#D1D5DB"/>

    <!-- Bottom Gold Laurel Bar -->
    <rect x="134" y="135" width="52" height="5" rx="2.5" fill="url(#goldRim)"/>
  </g>
</svg>
