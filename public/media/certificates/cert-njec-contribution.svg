<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="indigoMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="40%" stop-color="#6366F1"/>
      <stop offset="80%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="silverGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="shadowNjec" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F1115" flood-opacity="0.16"/>
    </filter>
  </defs>

  <circle cx="160" cy="98" r="86" fill="url(#glowIndigo)"/>

  <g filter="url(#shadowNjec)">
    <!-- Certificate Document Card -->
    <rect x="64" y="30" width="176" height="126" rx="10" fill="#1E1B4B" stroke="url(#indigoMetal)" stroke-width="2.5"/>
    <rect x="72" y="38" width="160" height="110" rx="6" fill="#FFFFFF"/>
    <rect x="78" y="44" width="148" height="98" rx="4" fill="none" stroke="#4F46E5" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Certificate Typography Lines -->
    <rect x="92" y="54" width="56" height="6" rx="3" fill="#4338CA"/>
    <rect x="92" y="68" width="112" height="8" rx="4" fill="#111827"/>
    <rect x="92" y="84" width="96" height="4" rx="2" fill="#9CA3AF"/>
    <rect x="92" y="94" width="84" height="4" rx="2" fill="#9CA3AF"/>
    <rect x="92" y="124" width="44" height="3" rx="1.5" fill="#6B7280"/>

    <!-- Overlapping 3D Hexagonal Honor Medal on Right -->
    <path d="M212 126 L204 170 L216 160 L226 172 L224 126 Z" fill="#3730A3"/>
    <path d="M224 126 L228 170 L238 158 L248 168 L236 126 Z" fill="#4F46E5"/>
    <polygon points="222,64 256,84 256,122 222,142 188,122 188,84" fill="url(#indigoMetal)" stroke="#E0E7FF" stroke-width="2"/>
    <polygon points="222,74 247,89 247,117 222,132 197,117 197,89" fill="#1E1B4B" stroke="url(#silverGold)" stroke-width="1.5"/>
    <polygon points="222,88 226,97 236,98 229,105 231,115 222,110 213,115 215,105 208,98 218,97" fill="url(#silverGold)"/>
  </g>
</svg>
